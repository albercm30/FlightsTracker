# Escaneos y avisos GRATIS en GitHub Actions (sin servidor y con tu PC apagado).
# Configuración rápida: ejecuta scripts/configurar-github-actions.ps1 (o sigue DEPLOY.md, sección 0).
#   Secrets:   TRAVELPAYOUTS_TOKEN, NTFY_TOPIC (y/o TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID)
#   Variables: ORIGINS, DESTINATIONS, ENABLE_SCHEDULED_SCAN=true
#              opcionales: TRIP_TYPE, MIN_NIGHTS, MAX_NIGHTS, PASSENGERS, BAGGAGE, RESIDENT_DISCOUNT,
#                          QUIET_HOURS, TZ, MONTHS_AHEAD, DIRECT_ONLY, DEAL_PCT, MIN_DAYS_AHEAD
# La base de datos (historial, anti-spam) se guarda entre ejecuciones en la caché de Actions.
# Repos públicos: minutos ilimitados en runners estándar. Privados: 2.000 min/mes gratis.
name: Escaneo programado

on:
  schedule:
    - cron: "17 */6 * * *"      # cada 6 horas (hora UTC)
  workflow_dispatch:
    inputs:
      demo:
        description: "Probar con precios SIMULADOS (sirve para comprobar que te llegan los avisos)"
        type: boolean
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read
  pages: write       # publicar la web pública en GitHub Pages
  id-token: write

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_SCAN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_PATH: data/flights.db
      DISABLE_SCHEDULER: "1"
      PRICE_PROVIDER: ${{ inputs.demo && 'demo' || 'travelpayouts' }}
      CACHE_PREFIX: ${{ inputs.demo && 'flights-db-demo-' || 'flights-db-' }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar configuración
        env:
          HAS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN != '' }}
          HAS_NOTIFY: ${{ secrets.NTFY_TOPIC != '' || secrets.TELEGRAM_BOT_TOKEN != '' || secrets.EMAIL_TO != '' }}
          ORIGINS: ${{ vars.ORIGINS }}
          DESTINATIONS: ${{ vars.DESTINATIONS }}
        run: |
          ok=1
          if [ -z "$ORIGINS" ]; then echo "::error::Falta la variable ORIGINS (p. ej. TCI,LPA,MAD)"; ok=0; fi
          if [ -z "$DESTINATIONS" ]; then echo "::error::Falta la variable DESTINATIONS (p. ej. LON,ROM,NYC)"; ok=0; fi
          if [ "$PRICE_PROVIDER" = "travelpayouts" ] && [ "$HAS_TOKEN" != "true" ]; then echo "::error::Falta el secret TRAVELPAYOUTS_TOKEN (gratis en travelpayouts.com). Para probar sin él, lanza el workflow con 'demo' activado."; ok=0; fi
          if [ "$HAS_NOTIFY" != "true" ]; then echo "::warning::No hay canal de avisos (NTFY_TOPIC, TELEGRAM_* o EMAIL_TO): se escaneará pero no recibirás nada."; fi
          [ $ok = 1 ]

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Recuperar base de datos anterior
        uses: actions/cache/restore@v4
        with:
          path: data/flights.db
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}

      - name: Escanear y avisar
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ORIGINS: ${{ vars.ORIGINS }}
          DESTINATIONS: ${{ vars.DESTINATIONS }}
          TRIP_TYPE: ${{ vars.TRIP_TYPE || 'rt' }}
          MIN_NIGHTS: ${{ vars.MIN_NIGHTS }}
          MAX_NIGHTS: ${{ vars.MAX_NIGHTS }}
          PASSENGERS: ${{ vars.PASSENGERS }}
          BAGGAGE: ${{ vars.BAGGAGE }}
          RESIDENT_DISCOUNT: ${{ vars.RESIDENT_DISCOUNT }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          MONTHS_AHEAD: ${{ vars.MONTHS_AHEAD }}
          DIRECT_ONLY: ${{ vars.DIRECT_ONLY }}
          DEAL_PCT: ${{ vars.DEAL_PCT }}
          MIN_DAYS_AHEAD: ${{ vars.MIN_DAYS_AHEAD }}
          TZ: ${{ vars.TZ || 'Europe/Madrid' }}
        run: python -m app scan

      - name: Generar web pública
        if: success() && vars.PUBLISH_SITE == 'true' && !inputs.demo
        env:
          SITE_TITLE: ${{ vars.SITE_TITLE }}
        run: python -m app export site

      - name: Subir web pública
        if: success() && vars.PUBLISH_SITE == 'true' && !inputs.demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar base de datos
        if: always() && hashFiles('data/flights.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/flights.db
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}

  # Publica la web de solo lectura en https://<usuario>.github.io/<repositorio>/
  deploy:
    needs: scan
    if: vars.PUBLISH_SITE == 'true' && !inputs.demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
