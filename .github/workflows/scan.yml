# Tu Flight Tracker funciona entero aquí, gratis:
#   1) busca los precios de tus destinos cada 6 horas
#   2) te manda por email solo las ofertas que merecen la pena
#   3) publica tu web en GitHub Pages
# Todo se configura desde tu web (Ajustes): guarda tus ajustes como variables/secrets de este repositorio.
# La base de datos (historial de precios y avisos ya enviados) se conserva entre ejecuciones en la caché.
name: Escaneo programado

on:
  schedule:
    - cron: "17 */6 * * *"      # cada 6 horas (hora UTC)
  workflow_dispatch:
    inputs:
      demo:
        description: "Probar con precios SIMULADOS"
        type: boolean
        default: false
      test:
        description: "Solo enviarme un email de prueba"
        type: boolean
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read
  pages: write       # publicar tu web en GitHub Pages
  id-token: write

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_SCAN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_PATH: data/flights.db
      PRICE_PROVIDER: ${{ inputs.demo && 'demo' || 'auto' }}   # sin clave de Travelpayouts -> precios simulados
      CACHE_PREFIX: ${{ inputs.demo && 'flights-db-demo-' || 'flights-db-' }}
      # --- tus ajustes (se cambian desde la web) ---
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SITE_URL: ${{ vars.SITE_URL }}
      ORIGINS: ${{ vars.ORIGINS }}
      DESTINATIONS: ${{ vars.DESTINATIONS }}
      TRIP_TYPE: ${{ vars.TRIP_TYPE || 'rt' }}
      MIN_NIGHTS: ${{ vars.MIN_NIGHTS }}
      MAX_NIGHTS: ${{ vars.MAX_NIGHTS }}
      PASSENGERS: ${{ vars.PASSENGERS }}
      BAGGAGE: ${{ vars.BAGGAGE }}
      RESIDENT_DISCOUNT: ${{ vars.RESIDENT_DISCOUNT }}
      QUIET_HOURS: ${{ vars.QUIET_HOURS }}
      MONTHS_AHEAD: ${{ vars.MONTHS_AHEAD }}
      MIN_DAYS_AHEAD: ${{ vars.MIN_DAYS_AHEAD }}
      ALERT_LEVEL: ${{ vars.ALERT_LEVEL }}
      ALERT_DROPS: ${{ vars.ALERT_DROPS }}
      MAX_STOPS: ${{ vars.MAX_STOPS }}
      MAX_DURATION_H: ${{ vars.MAX_DURATION_H }}
      DEP_WINDOWS: ${{ vars.DEP_WINDOWS }}
      EXCLUDE_AIRLINES: ${{ vars.EXCLUDE_AIRLINES }}
      TZ: ${{ vars.TZ || 'Europe/Madrid' }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar configuración
        run: |
          ok=1
          if [ -z "$ORIGINS" ] && [ "${{ inputs.test }}" != "true" ]; then echo "::error::Aún no has elegido desde dónde sales. Abre tu web → Ajustes."; ok=0; fi
          if [ -z "$DESTINATIONS" ] && [ "${{ inputs.test }}" != "true" ]; then echo "::error::Aún no tienes destinos. Abre tu web → Mis destinos."; ok=0; fi
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then echo "::warning::Sin clave de Travelpayouts: se usan precios SIMULADOS. Añádela en tu web → Ajustes."; fi
          if [ -z "$EMAIL_TO" ] || [ -z "$SMTP_PASSWORD" ]; then echo "::warning::Sin email configurado: no recibirás avisos. Configúralo en tu web → Ajustes."; fi
          [ $ok = 1 ]

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Recuperar base de datos anterior
        uses: actions/cache/restore@v4
        with:
          path: data/flights.db
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}

      - name: ${{ inputs.test && 'Enviar email de prueba' || 'Escanear y avisar' }}
        run: python -m app ${{ inputs.test && 'test-notify' || 'scan' }}

      - name: Generar tu web
        if: success() && !inputs.demo && !inputs.test
        env:
          SITE_TITLE: ${{ vars.SITE_TITLE }}
        run: python -m app export site

      - name: Subir tu web
        if: success() && !inputs.demo && !inputs.test
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar base de datos
        if: always() && hashFiles('data/flights.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/flights.db
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}

  # Publica tu web en https://<usuario>.github.io/<repositorio>/
  deploy:
    needs: scan
    if: ${{ !inputs.demo && !inputs.test }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
