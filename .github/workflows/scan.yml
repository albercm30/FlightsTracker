# Tu Flight Tracker funciona entero aquí, gratis:
#   · cada mañana busca los precios de tus destinos
#   · a las 8:00 (hora de Madrid) te envía el resumen con las mejores ofertas (llega a tu email vía GitHub)
#   · publica tu web en GitHub Pages
# Tus destinos y filtros están en config.json (se cambian desde tu web → «Guardar»).
# La base de datos (historial de precios y chollos ya avisados) se conserva en la caché de Actions.
name: Escaneo programado

on:
  schedule:
    # GitHub usa hora UTC: se lanza a las 5:35 y 6:35 UTC y solo sigue la que cae a las 7:35 en Madrid
    # (verano u invierno). Busca precios y envía el resumen a las 8:00.
    - cron: "35 5 * * *"
    - cron: "35 6 * * *"
  workflow_dispatch:
    inputs:
      resumen:
        description: "Enviarme ahora el resumen de ofertas"
        type: boolean
        default: false
      demo:
        description: "Probar con precios SIMULADOS (no publica la web)"
        type: boolean
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write      # el resumen diario se publica como issue y GitHub te lo manda por email
  pages: write       # publicar tu web
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_PATH: data/flights.db
      PRICE_PROVIDER: ${{ inputs.demo && 'demo' || 'auto' }}   # sin clave de Travelpayouts -> precios simulados
      CACHE_PREFIX: ${{ inputs.demo && 'flights-db-demo-' || 'flights-db-' }}
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}   # opcional: si existe, el resumen se envía por Gmail directamente
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GITHUB_TOKEN: ${{ github.token }}
      TZ: Europe/Madrid
      # compatibilidad con versiones anteriores (config.json tiene prioridad)
      ORIGINS: ${{ vars.ORIGINS }}
      DESTINATIONS: ${{ vars.DESTINATIONS }}
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: ¿Es la hora? (7:35 en Madrid)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Madrid date +%H)" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Ahora no toca (cambio de hora): la otra ejecución de hoy es la buena."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Recuperar base de datos anterior
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/flights.db
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}

      - name: Buscar precios
        if: steps.gate.outputs.run == 'true'
        run: python -m app scan

      - name: Enviar el resumen diario (a las 8:00)
        if: success() && steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.resumen)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            wait=$(( $(TZ=Europe/Madrid date -d 'today 08:00' +%s) - $(date +%s) ))
            if [ $wait -gt 0 ] && [ $wait -lt 1800 ]; then echo "Esperando $wait s hasta las 8:00…"; sleep $wait; fi
          fi
          python -m app daily

      - name: Generar tu web
        if: success() && steps.gate.outputs.run == 'true' && !inputs.demo
        run: python -m app export site

      - name: Subir tu web
        if: success() && steps.gate.outputs.run == 'true' && !inputs.demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar base de datos
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('data/flights.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/flights.db
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}

  # Publica tu web en https://<usuario>.github.io/<repositorio>/
  deploy:
    needs: scan
    if: ${{ needs.scan.outputs.run == 'true' && !inputs.demo }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
