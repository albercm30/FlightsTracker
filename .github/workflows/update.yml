# Actualiza tus vuelos cada mañana automáticamente (gratis, en GitHub):
#   1) busca los precios de todos tus seguimientos (config.json)
#   2) detecta chollos top y te avisa por email
#   3) publica la web en https://<usuario>.github.io/<repositorio>/
name: Actualizar vuelos

on:
  schedule:
    # GitHub usa hora UTC y a veces retrasa las ejecuciones programadas (hasta 1 h o más).
    # Por eso se programa varias veces: la primera que llega a partir de las 7:00 de Madrid
    # hace la búsqueda del día y las demás se saltan. Funciona en horario de verano e invierno.
    - cron: "5 5 * * *"
    - cron: "35 5 * * *"
    - cron: "5 6 * * *"
    - cron: "35 6 * * *"
    - cron: "15 8 * * *"
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Enviarme un email de prueba con el mejor chollo actual"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths: ["config.json", "web/**", "tracker/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  issues: write      # el aviso de chollos se publica como issue y GitHub te lo manda por email
  pages: write
  actions: write     # para que GitHub no apague la ejecución diaria tras 60 días sin cambios
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      DB_PATH: data/flights.db
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: ¿Toca buscar? (desde las 7:00 de Madrid, una vez al día)
        id: when
        run: |
          echo "day=$(TZ=Europe/Madrid date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "hour=$(TZ=Europe/Madrid date +%-H)" >> "$GITHUB_OUTPUT"
      - name: ¿Ya se ha buscado hoy?
        id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .done
          key: ft7-done-${{ steps.when.outputs.day }}
          lookup-only: true
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.done.outputs.cache-hit }}" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Hoy ya se ha buscado."
          elif [ "${{ steps.when.outputs.hour }}" -lt 7 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Aún no son las 7:00 en Madrid."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Recuperar el histórico de precios
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/flights.db
          key: ft7-db-${{ github.run_id }}
          restore-keys: ft7-db-
      - name: Buscar precios, avisar y generar la web
        if: steps.gate.outputs.run == 'true'
        run: python -m tracker ${{ inputs.test_alert && 'test-alert' || 'update' }} site
      - name: Guardar el histórico de precios
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('data/flights.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/flights.db
          key: ft7-db-${{ github.run_id }}
      - name: Marcar que hoy ya se ha buscado
        if: success() && steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: echo "${{ steps.when.outputs.day }}" > .done
      - if: success() && steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .done
          key: ft7-done-${{ steps.when.outputs.day }}
      - name: Mantener activa la ejecución diaria
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
      - uses: actions/upload-pages-artifact@v3
        if: success() && steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
