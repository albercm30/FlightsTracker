# Uso local o en tu servidor:      docker compose up -d --build
# Con HTTPS y tu dominio (Caddy):  DOMAIN=vuelos.midominio.com docker compose --profile https up -d --build
services:
  flight-tracker:
    build: .
    container_name: flight-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/data/flights.db
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - flight-tracker

volumes:
  caddy_data:
