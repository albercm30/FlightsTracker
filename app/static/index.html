<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flight Tracker</title>
  <meta name="description" content="Vigila precios de vuelos, encuentra el día más barato y recibe avisos de chollos.">
  <meta name="theme-color" content="#3656f5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vuelos">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="logo" href="#home"><span class="mark" data-icon="plane"></span>Flight Tracker</a>
    <nav class="nav" id="nav">
      <a href="#home" data-view="home"><span data-icon="home"></span>Inicio</a>
      <a href="#search" data-view="search"><span data-icon="search"></span>Mejor día</a>
      <a href="#explore" data-view="explore"><span data-icon="compass"></span>Explorar</a>
      <a href="#holidays" data-view="holidays"><span data-icon="sun"></span>Puentes y festivos</a>
      <a href="#calendar" data-view="calendar"><span data-icon="calendar"></span>Calendario</a>
      <a href="#destinations" data-view="destinations"><span data-icon="star"></span>Mis destinos</a>
      <a href="#alerts" data-view="alerts"><span data-icon="bell"></span>Alertas </a>
      <a href="#settings" data-view="settings"><span data-icon="settings"></span>Ajustes</a>
    </nav>
    <div class="foot">
      <div id="sideStatus">—</div>
      <button class="btn sm" id="scanBtn"><span data-icon="refresh"></span>Escanear ahora</button>
      <div class="row"><button class="btn ghost sm" id="themeBtn" title="Tema"><span data-icon="moon"></span>Tema</button>
</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <a class="logo" href="#home" style="padding:0"><span class="mark" data-icon="plane"></span>Flight Tracker</a>
      <span class="spacer"></span>
      <button class="btn icon ghost" id="scanBtnM" title="Escanear ahora"><span data-icon="refresh"></span></button>
      <button class="btn icon ghost" id="themeBtnM" title="Tema"><span data-icon="moon"></span></button>
    </header>
    <div class="content">
      <div id="banners"></div>
            <section class="view" id="view-home"></section>
      <section class="view" id="view-search"></section>
      <section class="view" id="view-explore"></section>
      <section class="view" id="view-holidays"></section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-destinations"></section>
      <section class="view" id="view-alerts"></section>
      <section class="view" id="view-settings"></section>
    </div>
  </div>
</div>

<nav class="bottomnav" id="bottomnav">
  <a href="#home" data-view="home"><span data-icon="home"></span>Inicio</a>
  <a href="#search" data-view="search"><span data-icon="search"></span>Buscar</a>
  <a href="#explore" data-view="explore"><span data-icon="compass"></span>Explorar</a>
  <a href="#alerts" data-view="alerts"><span data-icon="bell"></span>Alertas</a>
  <a href="#more" data-view="more"><span data-icon="menu"></span>Más</a>
</nav>

<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast hidden" id="toast"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/sealbox.js"></script>
<script src="/static/js/static-mode.js"></script>
<script src="/static/js/detail.js"></script>
<script src="/static/js/views.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
