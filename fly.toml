# Despliegue en Fly.io:  fly launch --copy-config --no-deploy
#                        fly volumes create datos --size 1
#                        fly secrets set APP_PASSWORD=... TRAVELPAYOUTS_TOKEN=...
#                        fly deploy
app = "flight-tracker-cambia-este-nombre"
primary_region = "mad"

[build]

[env]
  PORT = "8000"
  DB_PATH = "/data/flights.db"
  TRUST_PROXY = "1"
  COOKIE_SECURE = "1"
  TZ = "Europe/Madrid"

[mounts]
  source = "datos"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # debe seguir encendida para escanear y avisar
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
