# Guarda lo que cambias en la web (pestaña «Configurar») sin usuarios ni claves:
# «Guardar en GitHub» abre una issue «⚙️ …» ya rellena; al crearla, esto escribe config.json
# y lanza la actualización. Solo acepta issues creadas por el dueño del repositorio.
name: Guardar configuración

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '⚙️')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guardar en config.json
        run: python -m tracker apply-config
      - name: Subir el cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Configuración desde la web (#${{ github.event.issue.number }})" && git push; fi
      - name: Actualizar vuelos con la nueva configuración
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref "${{ github.event.repository.default_branch }}"
      - name: Cerrar la issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} --comment "✅ Guardado. Tu web se actualizará en unos minutos."
          else
            gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "❌ No se pudo guardar. Mira el detalle en Actions."
          fi
